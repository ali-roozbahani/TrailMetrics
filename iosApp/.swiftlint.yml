opt_in_rules:
  - force_unwrapping
  - unused_import
  - explicit_init
  - closure_spacing
  - empty_count
  - fatal_error_message

disabled_rules:
  - todo

force_unwrapping: error
force_cast: error
force_try: error

identifier_name:
  min_length: 3
  excluded: [id]

line_length:
  warning: 120
  error: 160

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 20

# `tm-ios` ("SKIE interop from Swift"): never drop an error. A `try?` stays only where
# dropping the error is deliberate, with the reason in a disable comment on the line above.
custom_rules:
  optional_try:
    name: "Optional Try"
    regex: '\btry\?'
    excluded_match_kinds:
      - comment
      - comment.mark
      - comment.url
      - doccomment
      - doccomment.field
      - string
    message: "`try?` drops the error. Handle it with do/catch, or, if dropping it is deliberate, add `// swiftlint:disable:next optional_try - <why the error can be dropped here>` above this line"
    severity: error

excluded:
  - Packages/*/.build/**
  - Packages/*/.swiftpm/**
  - "**/*.generated.swift"

reporter: "xcode"
