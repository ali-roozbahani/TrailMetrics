name: CI

on:
  pull_request:
    branches: [ main, 'feature/**' ]
  # Feature branches, epic integration branches included, are tested by their pull request. A push
  # trigger on a branch that has a pull request starts a second run for the same head commit (the
  # concurrency groups below differ), so only main is tested after a push.
  push:
    branches: [ main ]

# A new push to a pull request supersedes the SHA under test. A push event has a unique SHA in its
# group, so a run on main is never cancelled or replaced while pending.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pinned to ubuntu-26.04 after a trial on the PR that moved the pin; the pin is explicit so image
  # changes are chosen, not inherited from ubuntu-latest. This applies to every Ubuntu job below.
  # The Android build and tests. Skipped when the plan job (plan, below) decides "light": no changed
  # file can affect the Android or iOS build or tests (the allowlist of scripts/classify-changes.sh, minus
  # its heavy scripts). The required check "Android — all stages" is the aggregator `android`
  # at the end of this file, which also passes when this job was skipped on a light decision.
  android-build:
    name: Android build — lint, Detekt, tests, coverage, debug build, Room export
    needs: plan
    if: needs.plan.outputs.decision != 'light'
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lint

      - name: Run detekt
        run: ./gradlew detekt detektTyped

      - name: Run unit tests
        run: ./gradlew allTests test

      # Coverage report (Kover, merged in the root project): best-effort, can't fail the job.
      - name: Generate coverage report
        continue-on-error: true
        run: ./gradlew :koverXmlReport :koverHtmlReport :koverLog

      # Regression gate: each module's koverVerify minimum line coverage (rules in domain, data
      # and the three androidApp feature modules). Fails the job.
      - name: Verify coverage
        id: kover-verify
        run: ./gradlew koverVerify

      # Runs even when Verify coverage failed, so there is a report to look at.
      - name: Upload coverage report
        if: ${{ !cancelled() && steps.kover-verify.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-report
          path: build/reports/kover/
          if-no-files-found: warn

      - name: Build
        run: ./gradlew assembleDebug

      # Crashlytics without Analytics or the advertising ID (owner decision 2026-11-25): the merged manifest of the build above.
      - name: No analytics (Android)
        run: scripts/check-no-analytics-linked.sh --android

      # The build must leave data/schemas/ as committed: Room rewrites the current version's
      # schema file when an entity changed without a version bump.
      - name: Room schema export freshness
        run: scripts/check-room-schema.sh --check-export-fresh

  # Repo tooling: the policy checks and the self-tests of the workflow scripts, none of which is
  # about Android or iOS. It always runs: no path filter and no job-level `if`, because a required
  # check that is skipped or never created blocks the PR or hides a break. No `needs`: it runs in
  # parallel with the other jobs. A new script's self-test goes on scripts/checks/self-tests-tooling.list
  # (group `tooling`, runs here; a change to that list is light), the iOS-only groups on
  # scripts/checks/self-tests.list (run in ios-build; a heavy file) (tm-pr-workflow, "Tier 1").
  # The base-comparing checks every pull request needs, the light ones included, run here too: the Android
  # build job is skipped on a light decision, this one never is.
  tooling:
    name: Repo tooling — policy checks and script self-tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Board check
        run: scripts/check-board.sh

      - name: Protected paths check
        run: scripts/check-protected-paths.sh --validate

      - name: Scripts index check
        run: scripts/checks/scripts-index.sh --check

      # detekt cannot resolve println/print (config/detekt/detekt.yml), so a text check fails on them.
      - name: No println in production Kotlin
        run: scripts/check-no-println.sh

      # The self-tests of group `tooling` (scripts/checks/self-tests-tooling.list), which the gate reads
      # too. The list check fails when a script with a --self-test is on neither list.
      - name: Script self-tests
        run: |
          scripts/checks/self-tests.sh --check
          scripts/checks/self-tests.sh --run tooling

      # Coverage floors (config/kover-floors.properties) only go up: compared with the PR's base
      # commit, for every pull request, light ones too. scripts/ci/pr-base.sh validates the base and
      # fetches it at depth 1 when the checkout lacks it, as for scripts/classify-changes.sh --github.
      # A push has no base.
      - name: Kover floors check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # scripts/ci/pr-base.sh: exit 3 = no base (not a pull request), any other non-zero fails.
          rc=0
          BASE="$(scripts/ci/pr-base.sh)" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "Skipped: a '$EVENT_NAME' event has no base commit to compare the floors with."
            exit 0
          fi
          [ "$rc" = 0 ] || exit 1
          scripts/check-kover-floors.sh --base "$BASE"

      # Room schema (Decision 4 of docs/epics/protected-paths-review-2.md): compared with the PR's
      # base commit, for every pull request, light ones too, as "Kover floors check" does.
      - name: Room schema check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # scripts/ci/pr-base.sh: exit 3 = no base (not a pull request), any other non-zero fails.
          rc=0
          BASE="$(scripts/ci/pr-base.sh)" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "Skipped: a '$EVENT_NAME' event has no base commit to compare the Room schema with."
            exit 0
          fi
          [ "$rc" = 0 ] || exit 1
          scripts/check-room-schema.sh --base "$BASE"

  # The plan: classifies the change (light or full) for the Android and the iOS jobs. The iOS work is one
  # job, `ios-build` (SwiftLint, simulator tests, app build, package tests), behind the aggregator `ios`,
  # which keeps the required check name "iOS — all stages". The UI tests of both platforms are not run
  # here: they run in the local gate and in the full run on main (tm-testing, "Which test goes where").
  plan:
    name: CI plan — light or full
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.changes.outputs.decision }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Decides whether the Android and macOS jobs run: "light" only when no changed file of a pull
      # request can affect the Android or iOS build or tests (the allowlist in
      # scripts/classify-changes.sh, minus its heavy scripts); pushes and any error give "full".
      # continue-on-error: if this step fails, the output is unset and every Android and macOS
      # job runs (and the aggregators accept no skipped result for it).
      - name: Classify changes
        id: changes
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/classify-changes.sh --github

  ios-build:
    name: iOS build — lint, app build, package tests
    needs: plan
    if: needs.plan.outputs.decision != 'light'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      # The pinned release (config/swiftlint.pin), checked against its sha256: `brew install swiftlint` gives
      # whatever version Homebrew has that day, while the gate checks the pin.
      - name: Install SwiftLint
        run: |
          scripts/swiftlint-pin.sh --install "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version
          PATH="$RUNNER_TEMP/swiftlint:$PATH" scripts/swiftlint-pin.sh --check

      - name: Run SwiftLint
        run: |
          cd iosApp
          swiftlint lint --strict

      # The self-tests of groups `ios-swiftlint` (they need the swiftlint installed above) and
      # `macos` in scripts/checks/self-tests.list, which the gate reads too.
      - name: Script self-tests (iOS)
        run: scripts/checks/self-tests.sh --run ios-swiftlint macos

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Kotlin/Native directory, keyed on the Kotlin version of the version catalog (a Kotlin bump starts a new cache). On a
      # miss the compiler builds its own caches for the standard and platform libraries in the first link: the framework link took
      # about 116 s, against about 9 s with the directory restored; the download and unpacking of its dependencies were not timed
      # (the log stamps them within one second). Measured on this runner type (3 CPUs, 7.5 GB) on attempts of one commit, with
      # this directory alone (pairs B and C; pair A also cached DerivedData): the iOS job 4 min 54 s to 8 min 26 s shorter on a hit
      # (10:38 to 12:35 against 17:29 to 19:04 on a miss), the restore (375 MiB) 18 to 30 s, the save 20 to 30 s once
      # (`docs/epics/route-completion-to-domain.md`, "Evidence of the first run", item 4; PRs #372 and #373). Xcode's DerivedData is
      # not cached: its measured extra saving is inside the run-to-run noise, and a stale build product is a risk the owner decides.
      - name: Read the Kotlin version
        id: kotlin
        run: |
          version="$(sed -n 's/^kotlin = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
          if [ -z "$version" ]; then
            echo "::error file=gradle/libs.versions.toml::no Kotlin version found: the line kotlin = \"...\" is missing from gradle/libs.versions.toml, so the Kotlin/Native cache key would never change on a Kotlin bump"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the Kotlin/Native directory
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      # SwiftPM's shared cache: the git repositories and binary artifacts that xcodebuild's package resolution downloads (Firebase
      # and its dependencies since #377, the Maps SDK). Downloads only, no build product, so nothing stale can be linked; the working
      # copies and DerivedData are still made fresh. Keyed on every Package.resolved, so a version change starts a new entry.
      - name: Cache the Swift package downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm/repositories
            ~/Library/Caches/org.swift.swiftpm/artifacts
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('iosApp/**/Package.resolved') }}

      # Step limits of the steps that can hang (xcodebuild, Gradle, the simulator): sized from the measured normal times on this
      # runner, about 3 times the slowest, so a stall fails the step by itself with GitHub's message naming it ("The action
      # 'Run iOS package tests' has timed out after 20 minutes") instead of waiting for a human or the job's 30 minutes. Normal
      # times (runs of 2026-11-19 to 2026-11-21): Build KMP Shared Framework 84 to 272 s; Run iOS simulator tests 52 to 53 s;
      # Build iOS app 33 to 90 s; Build test-only framework variant 58 to 70 s; Run iOS package tests 130 to 629 s (a package
      # 116 to 287 s).
      - name: Build KMP Shared Framework
        timeout-minutes: 15
        run: scripts/build-kmp-framework.sh

      # No test-only Kotlin (the Swift test support of :shared-uitest) in the production framework.
      - name: Production framework check
        run: scripts/check-production-framework.sh

      # iOS simulator tests can't run on the ubuntu android-build job. data's
      # ActivityHistoryRepositoryImplTest runs in both jobs; only this run uses
      # the app's BundledSQLiteDriver (the host run uses AndroidSQLiteDriver).
      # shared-uitest, the test-only framework variant, has only iOS tests: those of its UI-test fakes
      # and of the Swift test support (SwiftTestSupportTest), which only a Mac can run.
      - name: Run iOS simulator tests
        timeout-minutes: 8
        run: ./gradlew :domain:iosSimulatorArm64Test :data:iosSimulatorArm64Test :shared:iosSimulatorArm64Test :shared-uitest:iosSimulatorArm64Test

      - name: Generate Secrets.xcconfig
        run: |
          cat <<EOF > iosApp/TrailMetrics/Secrets.xcconfig
          GMS_API_KEY = CI_PLACEHOLDER_KEY
          INFOPLIST_KEY_GMSApiKey = \$(GMS_API_KEY)
          EOF

      - name: Build iOS app
        timeout-minutes: 10
        run: |
          cd iosApp
          xcodebuild build \
            -project TrailMetrics.xcodeproj \
            -scheme TrailMetrics \
            -destination "generic/platform=iOS Simulator" \
            -skipMacroValidation \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      # The app built above: no analytics or advertising-ID code linked (owner decision 2026-11-25).
      - name: No analytics (iOS)
        run: scripts/check-no-analytics-linked.sh --ios

      # The package tests use the Kotlin test support (SwiftTestFlow and the rest), which only the
      # test-only variant of the framework holds. Built after "Build iOS app", which links production.
      - name: Build test-only framework variant
        timeout-minutes: 8
        run: scripts/build-kmp-framework.sh --variant uitest

      # Every iosApp/Packages/<Name>/ with a Tests/ directory; others are skipped.
      # `xcodebuild test` needs a concrete simulator, not generic/platform=iOS Simulator.
      # One package at a time, each under scripts/run-limited.sh (600 s, about twice the slowest package): a package whose
      # `xcodebuild test` goes silent (the History package did, for 4 min 56 s after its build, in run 44888237639) is killed
      # and named, and the next package runs; the step limit is the net under the loop.
      - name: Run iOS package tests
        timeout-minutes: 20
        run: |
          SIM_ID="$(xcrun simctl list devices available iPhone \
            | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | tail -1)"
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator"
            exit 1
          fi
          status=0
          for pkg in iosApp/Packages/*/; do
            name="$(basename "$pkg")"
            if [ ! -d "$pkg/Tests" ]; then
              echo "--- $name: no Tests/, skipped"
              continue
            fi
            echo "--- $name: xcodebuild test"
            # `|| rc=$?`: the step runs under `bash -e`, so a bare failing command would end the step here, before the
            # message and before the next package.
            rc=0
            (cd "$pkg" && "$GITHUB_WORKSPACE/scripts/run-limited.sh" 600 xcodebuild test \
              -scheme "$name" \
              -destination "platform=iOS Simulator,id=$SIM_ID" \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO) || rc=$?
            if [ "$rc" = 124 ]; then
              echo "::error title=iOS package tests::package $name stalled: xcodebuild test was killed after 600 s (a package takes 2 to 5 minutes)"
            fi
            [ "$rc" = 0 ] || status=1
          done
          exit $status

  # The required check "iOS — all stages". if: always() so that it reports when a job it
  # needs failed, was cancelled or timed out. It is green only when every needed job succeeded,
  # or, for the macOS job, was skipped while the decision is "light". An unset decision (a
  # failed classifier or plan job) is never "light".
  ios:
    name: iOS — all stages
    if: always()
    needs: [plan, ios-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Check results
        env:
          DECISION: ${{ needs.plan.outputs.decision }}
          RESULTS: >-
            plan=${{ needs.plan.result }}
            ios-build=${{ needs.ios-build.result }}
        run: |
          echo "plan decision: ${DECISION:-<empty>}"
          verdict=PASS
          for pair in $RESULTS; do
            id="${pair%%=*}"
            res="${pair#*=}"
            echo "needs.$id.result = $res"
            case "$res" in
              success) ;;
              skipped)
                if [ "$DECISION" != light ]; then
                  echo "::error::$id was skipped while the decision is '${DECISION:-<empty>}'"
                  verdict=FAIL
                fi ;;
              *)
                echo "::error::$id result is $res"
                verdict=FAIL ;;
            esac
          done
          echo "verdict=$verdict"
          [ "$verdict" = PASS ]

  # The required check "Android — all stages". if: always() so that it reports when the
  # build job is skipped (a light decision) or fails, as `ios` does for the iOS stages: the build job
  # may be skipped only while the decision is "light".
  android:
    name: Android — all stages
    if: always()
    needs: [plan, android-build]
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - name: Check results
        env:
          DECISION: ${{ needs.plan.outputs.decision }}
          RESULTS: >-
            plan=${{ needs.plan.result }}
            android-build=${{ needs.android-build.result }}
        run: |
          echo "plan decision: ${DECISION:-<empty>}"
          verdict=PASS
          for pair in $RESULTS; do
            id="${pair%%=*}"
            res="${pair#*=}"
            echo "needs.$id.result = $res"
            case "$res" in
              success) ;;
              skipped)
                if [ "$DECISION" != light ]; then
                  echo "::error::$id was skipped while the decision is '${DECISION:-<empty>}'"
                  verdict=FAIL
                fi ;;
              *)
                echo "::error::$id result is $res"
                verdict=FAIL ;;
            esac
          done
          echo "verdict=$verdict"
          [ "$verdict" = PASS ]
