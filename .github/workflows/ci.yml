name: CI

on:
  pull_request:
    branches: [ main, 'feature/**' ]
  # Feature branches are tested by their pull request (the merge result). Only main, and the epic
  # integration branches that subtask PRs merge into, are tested after a push.
  push:
    branches: [ main, 'feature/epic/**' ]

# A new push to a pull request supersedes the SHA under test. A push event has a unique SHA in its
# group, so a run on main or on an epic branch is never cancelled or replaced while pending.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pinned: ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19 (GitHub changelog,
  # 2026-09-17); move the pin only after a trial. This applies to every Ubuntu job below.
  android:
    name: Android — Lint, Detekt, Tests, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Decides whether the heavy steps below run: "light" only when every changed file of a
      # pull request is on the non-source allowlist in scripts/classify-changes.sh; pushes and
      # any error give "full". continue-on-error: if this step fails, the output is unset and
      # every heavy step runs.
      - name: Classify changes
        id: changes
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/classify-changes.sh --github

      - name: Board check
        run: scripts/check-board.sh

      - name: Protected paths check
        run: |
          scripts/check-protected-paths.sh --validate
          scripts/check-protected-paths.sh --self-test

      - name: Change classification self-test
        run: scripts/classify-changes.sh --self-test

      - name: Reviewer workflow self-test
        run: scripts/check-pr-review-workflow.sh --self-test

      - name: iOS scope self-test
        run: scripts/check-ios-scope.sh --self-test

      - name: Skill rule-change self-test
        run: scripts/check-skill-rule-changes.sh --self-test

      - name: Kover floors self-test
        run: scripts/check-kover-floors.sh --self-test

      - name: Room schema self-test
        run: scripts/check-room-schema.sh --self-test

      - name: Variant API check self-test
        run: scripts/check-variant-api.sh --self-test

      # Coverage floors (config/kover-floors.properties) only go up: compared with the PR's base
      # commit, for every pull request, light ones too. The base is fetched at depth 1 when the
      # checkout lacks it, as scripts/classify-changes.sh --github does. A push has no base.
      - name: Kover floors check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "Skipped: a '$EVENT_NAME' event has no base commit to compare the floors with."
            exit 0
          fi
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "PR_BASE_SHA is not a commit SHA"
            exit 1
          fi
          if ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet --depth=1 origin "$PR_BASE_SHA"
          fi
          scripts/check-kover-floors.sh --base "$PR_BASE_SHA"

      # Room schema (Decision 4 of docs/epics/protected-paths-review-2.md): compared with the PR's
      # base commit, for every pull request, light ones too, as "Kover floors check" does.
      - name: Room schema check
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "Skipped: a '$EVENT_NAME' event has no base commit to compare the Room schema with."
            exit 0
          fi
          if [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$PR_BASE_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "PR_BASE_SHA is not a commit SHA"
            exit 1
          fi
          if ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --quiet --depth=1 origin "$PR_BASE_SHA"
          fi
          scripts/check-room-schema.sh --base "$PR_BASE_SHA"

      - name: Set up JDK 17
        if: steps.changes.outputs.decision != 'light'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changes.outputs.decision != 'light'
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        if: steps.changes.outputs.decision != 'light'
        run: ./gradlew lint

      - name: Run detekt
        if: steps.changes.outputs.decision != 'light'
        run: ./gradlew detekt

      - name: Run unit tests
        if: steps.changes.outputs.decision != 'light'
        run: ./gradlew allTests test

      # Coverage report (Kover, merged in the root project): best-effort, can't fail the job.
      - name: Generate coverage report
        if: steps.changes.outputs.decision != 'light'
        continue-on-error: true
        run: ./gradlew :koverXmlReport :koverHtmlReport :koverLog

      # Regression gate: each module's koverVerify minimum line coverage (rules in domain, data
      # and the three androidApp feature modules). Fails the job.
      - name: Verify coverage
        if: steps.changes.outputs.decision != 'light'
        id: kover-verify
        run: ./gradlew koverVerify

      # Runs even when Verify coverage failed, so there is a report to look at.
      - name: Upload coverage report
        if: ${{ !cancelled() && steps.kover-verify.outcome != 'skipped' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage-report
          path: build/reports/kover/
          if-no-files-found: warn

      - name: Build
        if: steps.changes.outputs.decision != 'light'
        run: ./gradlew assembleDebug

      # The build must leave data/schemas/ as committed: Room rewrites the current version's
      # schema file when an entity changed without a version bump.
      - name: Room schema export freshness
        if: steps.changes.outputs.decision != 'light'
        run: scripts/check-room-schema.sh --check-export-fresh

  # The iOS work is split into parallel jobs behind one aggregator, `ios`, which keeps the required
  # check name "iOS — all stages". The iOS wall time is the longer of two chains: ios-main alone
  # (SwiftLint, simulator tests, app build, package tests), or ios-build-ui then ios-ui.
  ios-plan:
    name: iOS 1 — plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.changes.outputs.decision }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Decides whether the macOS jobs run: "light" only when every changed file of a pull
      # request is on the non-source allowlist in scripts/classify-changes.sh; pushes and any
      # error give "full". continue-on-error: if this step fails, the output is unset and
      # every macOS job runs (and the aggregator accepts no skipped result for it).
      - name: Classify changes
        id: changes
        continue-on-error: true
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: scripts/classify-changes.sh --github

  # Builds the UI-test products once and hands them to ios-ui as one archive: the UI tests need
  # nothing else of the old job. The test-only framework variant is built by
  # scripts/build-kmp-framework.sh --variant uitest, which builds production too for its API
  # check, so no separate production framework step is needed here.
  ios-build-ui:
    name: iOS 2a — build UI-test app
    needs: ios-plan
    if: needs.ios-plan.outputs.decision != 'light'
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Secrets.xcconfig
        run: |
          cat <<EOF > iosApp/TrailMetrics/Secrets.xcconfig
          GMS_API_KEY = CI_PLACEHOLDER_KEY
          INFOPLIST_KEY_GMSApiKey = \$(GMS_API_KEY)
          EOF

      - name: Build UI-test framework variant
        run: scripts/build-kmp-framework.sh --variant uitest

      # Scheme TrailMetricsUITests (Debug-UITest from its test action) and the build settings
      # of the former "Run iOS UI tests" step, with a generic simulator destination and
      # -testProductsPath instead of running the tests.
      - name: Build UI-test products
        run: |
          mkdir -p "$RUNNER_TEMP/ui-products"
          cd iosApp
          xcodebuild build-for-testing \
            -project TrailMetrics.xcodeproj \
            -scheme TrailMetricsUITests \
            -destination "generic/platform=iOS Simulator" \
            -testProductsPath "$RUNNER_TEMP/ui-products/TrailMetricsUITests.xctestproducts" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO

      # actions/upload-artifact zips and does not keep executable bits or symlinks, so the
      # products travel as one tar.gz.
      - name: Pack UI-test products
        run: |
          mkdir -p "$RUNNER_TEMP/ui-handoff"
          tar -czf "$RUNNER_TEMP/ui-handoff/ui-products.tar.gz" -C "$RUNNER_TEMP/ui-products" .
          ls -l "$RUNNER_TEMP/ui-handoff/ui-products.tar.gz"

      - name: Upload UI-test products
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-products
          path: ${{ runner.temp }}/ui-handoff
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  # No checkout: everything the tests need is in the products archive. Same simulator selection
  # as the package tests of ios-main. No retries (D6 of docs/epics/ios-ui-tests.md). The result
  # bundle goes to $RUNNER_TEMP, which the runner empties for every job.
  ios-ui:
    name: iOS 3 — run UI tests (after 2a)
    needs: [ios-plan, ios-build-ui]
    if: needs.ios-plan.outputs.decision != 'light'
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Download UI-test products
        uses: actions/download-artifact@v8
        with:
          name: ios-ui-test-products
          path: ${{ runner.temp }}/downloaded-ui-products

      - name: Unpack UI-test products
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked-ui-products"
          tar -xzf "$RUNNER_TEMP/downloaded-ui-products/ui-products.tar.gz" -C "$RUNNER_TEMP/unpacked-ui-products"

      - name: Run iOS UI tests
        id: ui_tests
        run: |
          SIM_ID="$(xcrun simctl list devices available iPhone \
            | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | tail -1)"
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator"
            exit 1
          fi
          xcodebuild test-without-building \
            -testProductsPath "$RUNNER_TEMP/unpacked-ui-products/TrailMetricsUITests.xctestproducts" \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -resultBundlePath "$RUNNER_TEMP/TrailMetricsUITests.xcresult" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload UI test results
        if: failure() && steps.ui_tests.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-results-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/TrailMetricsUITests.xcresult
          if-no-files-found: warn
          retention-days: 7

  ios-main:
    name: iOS 2b — lint, app build, package tests
    needs: ios-plan
    if: needs.ios-plan.outputs.decision != 'light'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          cd iosApp
          swiftlint lint --strict

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build KMP Shared Framework
        run: scripts/build-kmp-framework.sh

      # iOS simulator tests can't run on the ubuntu android job. data's
      # ActivityHistoryRepositoryImplTest runs in both jobs; only this run uses
      # the app's BundledSQLiteDriver (the host run uses AndroidSQLiteDriver).
      # shared has only iOS tests: its iosTest source set holds the Swift test
      # support's own tests (SwiftTestSupportTest), which only a Mac can run.
      # shared-uitest, the test-only framework variant, has only iOS tests too: those of its UI-test fakes.
      - name: Run iOS simulator tests
        run: ./gradlew :domain:iosSimulatorArm64Test :data:iosSimulatorArm64Test :shared:iosSimulatorArm64Test :shared-uitest:iosSimulatorArm64Test

      - name: Generate Secrets.xcconfig
        run: |
          cat <<EOF > iosApp/TrailMetrics/Secrets.xcconfig
          GMS_API_KEY = CI_PLACEHOLDER_KEY
          INFOPLIST_KEY_GMSApiKey = \$(GMS_API_KEY)
          EOF

      - name: Build iOS app
        run: |
          cd iosApp
          xcodebuild build \
            -project TrailMetrics.xcodeproj \
            -scheme TrailMetrics \
            -destination "generic/platform=iOS Simulator" \
            -skipMacroValidation \
            ARCHS=arm64 \
            EXCLUDED_ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      # Every iosApp/Packages/<Name>/ with a Tests/ directory; others are skipped.
      # `xcodebuild test` needs a concrete simulator, not generic/platform=iOS Simulator.
      - name: Run iOS package tests
        run: |
          SIM_ID="$(xcrun simctl list devices available iPhone \
            | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | tail -1)"
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator"
            exit 1
          fi
          status=0
          for pkg in iosApp/Packages/*/; do
            name="$(basename "$pkg")"
            if [ ! -d "$pkg/Tests" ]; then
              echo "--- $name: no Tests/, skipped"
              continue
            fi
            echo "--- $name: xcodebuild test"
            (cd "$pkg" && xcodebuild test \
              -scheme "$name" \
              -destination "platform=iOS Simulator,id=$SIM_ID" \
              -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO) || status=1
          done
          exit $status

  # The required check "iOS — all stages". if: always() so that it reports when a job it
  # needs failed, was cancelled or timed out. It is green only when every needed job succeeded,
  # or, for the macOS jobs, was skipped while the decision is "light". An unset decision (a
  # failed classifier or plan job) is never "light".
  ios:
    name: iOS — all stages
    if: always()
    needs: [ios-plan, ios-build-ui, ios-ui, ios-main]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check results
        env:
          DECISION: ${{ needs.ios-plan.outputs.decision }}
          RESULTS: >-
            ios-plan=${{ needs.ios-plan.result }}
            ios-build-ui=${{ needs.ios-build-ui.result }}
            ios-ui=${{ needs.ios-ui.result }}
            ios-main=${{ needs.ios-main.result }}
        run: |
          echo "plan decision: ${DECISION:-<empty>}"
          verdict=PASS
          for pair in $RESULTS; do
            id="${pair%%=*}"
            res="${pair#*=}"
            echo "needs.$id.result = $res"
            case "$res" in
              success) ;;
              skipped)
                if [ "$DECISION" != light ]; then
                  echo "::error::$id was skipped while the decision is '${DECISION:-<empty>}'"
                  verdict=FAIL
                fi ;;
              *)
                echo "::error::$id result is $res"
                verdict=FAIL ;;
            esac
          done
          echo "verdict=$verdict"
          [ "$verdict" = PASS ]
