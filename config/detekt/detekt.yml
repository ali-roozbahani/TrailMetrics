build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'NotificationReport'

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false

complexity:
  TooManyFunctions:
    active: true
    thresholdInClasses: 12
  LongMethod:
    active: true
    threshold: 60
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 7
    constructorThreshold: 7
    excludes: ['**/domain/**/TrackingSessionManager.kt', '**/feature/tracking/TrackingViewModel.kt']

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
