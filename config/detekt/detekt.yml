build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

processors:
  active: true

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'NotificationReport'

style:
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  ForbiddenMethodCall:
    active: true
    methods:
      - reason: 'Use a proper logger (or Koin-injected Logger) instead of println/print.'
        value: 'kotlin.io.println'
      - reason: 'Use a proper logger instead of print.'
        value: 'kotlin.io.print'
  ForbiddenImport:
    active: true
    imports:
      - value: 'kotlinx.coroutines.GlobalScope'
        reason: 'GlobalScope leaks coroutines outside any lifecycle. Inject or use viewModelScope/a scoped CoroutineScope instead.'

complexity:
  TooManyFunctions:
    active: true
    thresholdInClasses: 12
  LongMethod:
    active: true
    threshold: 60
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    active: true
    threshold: 15
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    functionThreshold: 7
    constructorThreshold: 7
    excludes: ['**/domain/**/TrackingSessionManager.kt', '**/feature/tracking/TrackingViewModel.kt']

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
