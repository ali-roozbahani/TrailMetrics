# Kover coverage floors: each module's minimum line coverage in percent, which its koverVerify
# enforces (the gate and CI). One `<module>=<integer>` line per module that reads this file in its
# build.gradle.kts; the key is the module's directory name. Floors only go up:
# scripts/check-kover-floors.sh fails the gate and CI when a value is lower than on the base
# branch, when a module that reads this file has no entry, or when an entry has no module.
